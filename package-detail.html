<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Package Details | GOJO</title>
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/packages.css" />
    <link rel="stylesheet" href="styles/package-detail.css" />
</head>

<body>
    <!-- existing header -->

    <main class="page-content">
        <section class="package-hero">
            <img id="packageImage" class="package-hero-image" src="" alt="" />
            <div class="package-hero-overlay">
                <h1 id="packageName"></h1>
                <p id="packageSummary"></p>
                <div class="package-hero-meta">
                    <span id="packageNights"></span>
                    <span id="packageRoute"></span>
                    <span id="packagePrice"></span>
                </div>
            </div>
        </section>

        <section class="package-layout">
            <div class="package-main">
                <h2>Itinerary</h2>
                <div id="itinerary"></div>
            </div>

            <aside class="package-sidebar">
                <div class="package-card booking-card">
                    <h3>Book this package</h3>
                    <label class="form-label">
                        Start date
                        <input type="date" id="startDate" class="form-input" />
                    </label>
                    <label class="form-label">
                        Travelers
                        <input type="number" id="guests" class="form-input" min="1" value="2" />
                    </label>

                    <div id="ticketSection"
                        style="display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color);">
                        <label class="form-group-checkbox"
                            style="display: flex; gap: 0.5rem; align-items: center; cursor: pointer;">
                            <input type="checkbox" id="includeTicket"
                                style="width: 1.2rem; height: 1.2rem; accent-color: var(--primary-color);">
                            <span>
                                <strong>Include Entry Tickets</strong>
                                <span style="display: block; font-size: 0.85rem; color: var(--primary-color);">+$<span
                                        id="ticketPrice">0</span>/person</span>
                            </span>
                        </label>

                        <div id="ticketDateWrapper" style="display: none; margin-top: 0.75rem; margin-left: 1.8rem;">
                            <label class="form-label" style="font-size: 0.9rem;">
                                Select date for tickets
                                <input type="date" id="ticketDate" class="form-input" />
                            </label>
                        </div>
                    </div>
                    <button id="bookPackageBtn" class="btn-primary btn-block">Continue to booking</button>
                    <p class="small-text">You’ll review and pay on the next step.</p>
                </div>

                <div class="package-card">
                    <h3>Includes</h3>
                    <ul id="includesList" class="bullet-list"></ul>
                </div>
            </aside>
        </section>
    </main>

    <!-- footer -->

    <script src="scripts/package-detail.js" defer></script>
</body>

</html>
